version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: pocisys-hash-monitor_server_1
      APP_PORT: 8765

  server:
    image: python:3.12-alpine
    restart: on-failure
    init: true
    working_dir: /app
    read_only: true
    stop_grace_period: 15s
    environment:
      POCISYS_CONFIG_PATH: /data/config.json
      POCISYS_HOST: 0.0.0.0
      POCISYS_PORT: "8765"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ./main.py:/app/main.py:ro
      - ./config.default.json:/app/config.default.json:ro
      - ./start.sh:/app/start.sh:ro
      - ./miners:/app/miners:ro
      - ./services:/app/services:ro
      - ./web:/app/web:ro
    tmpfs:
      - /tmp:size=16m
    command: ["/bin/sh", "/app/start.sh"]
